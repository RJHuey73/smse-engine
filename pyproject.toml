[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smse-engine"
version = "0.1.0"
description = "Shadowfox SMSE Engine v0 — SFX-MARKET-011–014 deterministic core"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
smse-engine = "smse_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smse_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Canon text uses γ, ∆, en dashes and em dashes verbatim.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
